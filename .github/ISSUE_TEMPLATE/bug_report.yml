name: Bug Report
description: Report a reproducible bug in Zerra.
title: "[Bug]: "
labels: ["bug", "needs-triage"]

body:
  - type: markdown
    attributes:
      value: >
        Before submitting, please search [existing issues](https://github.com/sjsreehari/zerra/issues?q=is%3Aissue+sort%3Acreated-desc)
        to avoid duplicates.

  - type: markdown
    attributes:
      value: |
        **Security notice:** If you are pasting logs, config, or environment output, make sure it does not contain secrets, tokens, or credentials. Replace sensitive values with `<REDACTED>`.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Zerra is affected?
      options:
        - Webhook ingestion (NestJS)
        - Scanner worker (Go / Semgrep / Syft / OSV)
        - Secret scanner
        - Fix engine
        - AI agent (Python / LangGraph)
        - CLI (zerra init)
        - Dashboard (Next.js)
        - Docker / Compose stack
        - CI / GitHub Actions
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Paste the output of the following commands:
        ```sh
        node --version
        python --version
        go version
        docker --version
        docker compose version
        git log --oneline -1
        ```
      value: |
        <details>
        <summary>Environment output</summary>

        ```
        node:
        python:
        go:
        docker:
        docker compose:
        zerra commit:
        OS:
        ```

        </details>
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: |
        A clear and concise description of the bug.
        Include a minimal reproduction — the shortest sequence of steps or code that triggers the issue.
        Avoid external dependencies or large payloads; trim to the essentials so it is easy to reproduce.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Paste error messages, stack traces, or terminal output.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Paste any relevant logs here. Run services with verbose output if possible:
        - NestJS: `LOG_LEVEL=debug npm run dev --workspace=apps/backend`
        - Go worker: `go run ./cmd/worker -v`
        - Docker: `docker compose logs --tail=100`
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I included a minimal reproduction.
          required: true
        - label: I redacted any secrets or credentials from logs and config.
          required: true
