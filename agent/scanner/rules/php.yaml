rules:
  # ── SQL Injection ──────────────────────────────────────────────────────
  - id: php-sql-injection-mysql-query
    title: SQL Injection via mysql_query (PHP)
    description: Using deprecated mysql_query with string concatenation is vulnerable to SQL injection. Use PDO with prepared statements.
    severity: critical
    languages: [php]
    pattern: 'mysql_query\s*\(\s*"[^"]*"\s*\.'
    cwe_id: "CWE-89"
    owasp_category: "A03:2021 Injection"
    confidence: 0.90
    fix_hint: "Use PDO: $stmt = $pdo->prepare('SELECT * FROM users WHERE id = ?'); $stmt->execute([$id]);"

  - id: php-sql-injection-mysqli-query
    title: SQL Injection via mysqli_query (PHP)
    description: String concatenation in mysqli_query enables SQL injection.
    severity: high
    languages: [php]
    pattern: 'mysqli_query\s*\([^,]+,\s*"[^"]*"\s*\.'
    cwe_id: "CWE-89"
    owasp_category: "A03:2021 Injection"
    confidence: 0.85

  - id: php-sql-injection-variable-in-query
    title: SQL Injection via Variable in Query (PHP)
    description: Direct variable interpolation in SQL strings enables injection.
    severity: high
    languages: [php]
    pattern: '"[^"]*(?:SELECT|INSERT|UPDATE|DELETE)[^"]*\$[a-zA-Z_]+'
    cwe_id: "CWE-89"
    owasp_category: "A03:2021 Injection"
    confidence: 0.80

  # ── Command Injection ──────────────────────────────────────────────────
  - id: php-exec-shell-injection
    title: Command Injection via exec() (PHP)
    description: exec(), shell_exec(), system() with user input enables OS command injection.
    severity: critical
    languages: [php]
    pattern: '(?:exec|shell_exec|system|passthru|popen)\s*\([^)]*\$(?:_GET|_POST|_REQUEST|_COOKIE|_SERVER)[^)]*\)'
    cwe_id: "CWE-78"
    owasp_category: "A03:2021 Injection"
    confidence: 0.90

  - id: php-backtick-command
    title: Command Injection via Backtick Operator (PHP)
    description: PHP backtick operator executes shell commands and may be injectable.
    severity: high
    languages: [php]
    pattern: '`[^`]*\$(?:_GET|_POST|_REQUEST)[^`]*`'
    cwe_id: "CWE-78"
    confidence: 0.85

  # ── XSS ────────────────────────────────────────────────────────────────
  - id: php-echo-user-input
    title: Reflected XSS via echo with User Input (PHP)
    description: Echoing unescaped user input enables Cross-Site Scripting.
    severity: high
    languages: [php]
    pattern: 'echo\s+\$(?:_GET|_POST|_REQUEST|_COOKIE)\s*\['
    cwe_id: "CWE-79"
    owasp_category: "A03:2021 Injection"
    confidence: 0.90
    fix_hint: "Use htmlspecialchars(): echo htmlspecialchars($_GET['name'], ENT_QUOTES, 'UTF-8');"

  - id: php-print-user-input
    title: Reflected XSS via print with User Input (PHP)
    description: Printing unescaped user input enables Cross-Site Scripting.
    severity: high
    languages: [php]
    pattern: 'print\s+\$(?:_GET|_POST|_REQUEST|_COOKIE)\s*\['
    cwe_id: "CWE-79"
    confidence: 0.90

  # ── File Inclusion ─────────────────────────────────────────────────────
  - id: php-local-file-inclusion
    title: Local/Remote File Inclusion (PHP)
    description: include/require with user-controlled paths enables file inclusion attacks.
    severity: critical
    languages: [php]
    pattern: '(?:include|require)(?:_once)?\s*\([^)]*\$(?:_GET|_POST|_REQUEST|_COOKIE)[^)]*\)'
    cwe_id: "CWE-98"
    owasp_category: "A03:2021 Injection"
    confidence: 0.90

  # ── Path Traversal ─────────────────────────────────────────────────────
  - id: php-path-traversal
    title: Path Traversal via User Input (PHP)
    description: File operations with user-controlled paths can traverse directories.
    severity: high
    languages: [php]
    pattern: '(?:file_get_contents|fopen|readfile|unlink|mkdir|rmdir)\s*\([^)]*\$(?:_GET|_POST|_REQUEST)[^)]*\)'
    cwe_id: "CWE-22"
    owasp_category: "A01:2021 Broken Access Control"
    confidence: 0.85

  # ── Insecure Deserialization ────────────────────────────────────────────
  - id: php-unserialize-user-input
    title: Insecure Deserialization via unserialize() (PHP)
    description: Calling unserialize() on user-supplied data enables object injection attacks.
    severity: critical
    languages: [php]
    pattern: 'unserialize\s*\([^)]*\$(?:_GET|_POST|_REQUEST|_COOKIE|_SESSION)[^)]*\)'
    cwe_id: "CWE-502"
    owasp_category: "A08:2021 Software and Data Integrity Failures"
    confidence: 0.95
    fix_hint: "Use json_decode() instead of unserialize() for user-supplied data."

  # ── Hardcoded Secrets ──────────────────────────────────────────────────
  - id: php-hardcoded-password
    title: Hardcoded Password (PHP)
    description: Password literal hardcoded in PHP source code.
    severity: high
    languages: [php]
    pattern: '\$(?:password|passwd|pwd|secret)\s*=\s*[''"][^''"]{4,}[''"]'
    cwe_id: "CWE-259"
    confidence: 0.80

  # ── Weak Crypto ────────────────────────────────────────────────────────
  - id: php-md5-password
    title: MD5 Used for Password Hashing (PHP)
    description: MD5 is not suitable for password storage. Use password_hash().
    severity: high
    languages: [php]
    pattern: 'md5\s*\(\s*\$(?:password|passwd|pass)\s*\)'
    cwe_id: "CWE-327"
    confidence: 0.90
    fix_hint: "Use password_hash($password, PASSWORD_BCRYPT) and password_verify() for authentication."

  - id: php-sha1-password
    title: SHA-1 Used for Password Hashing (PHP)
    description: SHA-1 is not suitable for password storage. Use password_hash().
    severity: high
    languages: [php]
    pattern: 'sha1\s*\(\s*\$(?:password|passwd|pass)\s*\)'
    cwe_id: "CWE-327"
    confidence: 0.90
